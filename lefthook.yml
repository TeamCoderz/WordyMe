# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
#
# pre-push:
#   jobs:
#     - name: packages audit
#       tags:
#         - frontend
#         - security
#       run: yarn audit
#
#     - name: gems audit
#       tags:
#         - backend
#         - security
#       run: bundle audit
#
pre-commit:
  jobs:
    - name: spdx-fix
      run: pnpm license:fix {staged_files}
      glob: '**/*.{ts,tsx,js,jsx}'
      stage_fixed: true

    # Prettier directly rather than `pnpm format`, which carries its own glob:
    # appending {staged_files} to it did nothing, so every commit reformatted the
    # whole repository and still skipped the css/js/json files this job passes.
    # --ignore-unknown skips what Prettier cannot parse instead of failing the
    # commit, and .prettierignore keeps generated files out.
    - name: format
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
