name: Publish Release

# Step 2 of 2. Triggered by merging the release pull request — the one a person
# opens from the branch that Prepare Release pushed.
#
# It runs on every push to main and exits in seconds unless the version in
# package.json has no matching tag. That check, rather than matching the commit
# message, is what decides whether to release:
#
#   - it survives someone editing the squash-merge title
#   - it cannot double-publish, because the tag makes the condition false
#     forever after
#
# The tag is created LAST, after the images are published. Tag existence is the
# completion marker, so the ordering is what makes a failed release recoverable:
# if the vulnerability gate or a registry push fails, no tag exists yet, and
# re-running the workflow simply does the whole thing again. Tagging first would
# strand a tag pointing at an unpublished release that no re-run could ever
# finish, because the check would see the tag and skip.
#
# Tagging and publishing stay in one run on purpose. A tag pushed with
# GITHUB_TOKEN does not start new workflow runs, so a separate
# `on: push: tags` workflow would never fire.

on:
  push:
    branches:
      - main

concurrency:
  # One evaluation at a time. Two merges landing close together would otherwise
  # race: both could see an untagged version before either pushes the tag, and
  # the loser would fail red on the tag push. Serialised, the second run sees
  # the tag and skips cleanly. No cancel-in-progress — interrupting a
  # half-finished publish is worse than queueing behind it.
  group: release-publish
  cancel-in-progress: false

# Nothing by default; each job asks for exactly what it needs. A job added
# later without its own block gets no permissions instead of GitHub's defaults.
permissions: {}

env:
  # Both registries are published in parallel. GHCR is the one documented as the
  # default pull source: Docker Hub throttles unauthenticated pulls to 100 per
  # 6 hours *per IP address*, which a school or office behind one NAT shares
  # between everyone. Names are hardcoded rather than derived from
  # github.repository_owner because GHCR requires them lowercase and the org is
  # spelled "TeamCoderz".
  DOCKERHUB_IMAGE: teamcoderz/wordyme
  GHCR_IMAGE: ghcr.io/teamcoderz/wordyme

jobs:
  # ==========================================================================
  # Is this a release commit?
  # ==========================================================================
  check:
    name: Check for an unreleased version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      release: ${{ steps.detect.outputs.release }}
      # One timestamp for the whole release, stamped into both architectures'
      # org.opencontainers.image.created labels. Left to metadata-action's
      # default, each build job would stamp its own start time and the two
      # manifests of one release would disagree.
      created: ${{ steps.detect.outputs.created }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed to answer "has this version already been released?".
          fetch-depth: 0
          persist-credentials: false

      - name: Compare package.json against the existing tags
        id: detect
        run: |
          set -euo pipefail
          VERSION=$(node -pe "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already tagged — nothing to publish."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION has no tag — publishing."
          fi

          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # Build, scan and push each architecture — natively, in parallel
  # ==========================================================================
  # One job per architecture, each on a runner of its own kind. arm64 used to
  # be built through QEMU emulation inside a single amd64 job, which made it
  # by far the slowest step of a release; on a native arm64 runner it costs
  # about the same as the amd64 build and the two run side by side.
  #
  # Each architecture is scanned BEFORE it is pushed, so nothing unscanned
  # ever reaches a registry. The push is by digest only — no tag of any kind
  # exists until the merge job below has both digests, so the tag-last
  # completion-marker design is unchanged.
  build-amd64:
    name: Build and push linux/amd64
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR using GITHUB_TOKEN
      security-events: write # upload the Trivy report to the Security tab
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default ref — github.sha, the merge commit that triggered this
          # run. No tag exists yet; the tag job creates it at this same commit
          # once publishing has succeeded.
          # This job only reads the repository, and it runs several third-party
          # actions. Leaving the token in .git/config would expose it to all of
          # them for no benefit.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # --- Gate: scan before anything is published -------------------------
      # Built and loaded locally so the scan runs against a real image. The
      # push below reuses the layers this build leaves in the builder, so it
      # costs almost nothing the second time.
      #
      # The second cache-from line reads the cache written before the builds
      # were split per architecture, so the first release after the split
      # still starts warm.
      - name: Build for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wordyme:scan
          cache-from: |
            type=gha,scope=linux-amd64
            type=gha
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: Fail the release on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wordyme:scan
          format: table
          severity: CRITICAL,HIGH
          # Only gate on issues that can actually be acted on. A CVE with no
          # published fix would otherwise block every release indefinitely.
          ignore-unfixed: true
          exit-code: '1'

      # Each architecture reports under its own category, so a finding that
      # exists in only one of them is attributable rather than averaged away.
      # This one keeps the original category name: renaming it would orphan
      # the history already in the Security tab.
      - name: Full vulnerability report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wordyme:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'

      - name: Upload report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: trivy-results.sarif
          category: container-image

      # --- Push by digest --------------------------------------------------
      # No tag of any kind yet: the image lands on both registries addressed
      # only by its digest, and nothing is discoverable by tag until the merge
      # job ties both architectures into the tagged manifest lists. A run that
      # fails after this point leaves untagged digests behind — harmless and
      # invisible to `docker pull`, but do not point "delete untagged
      # versions" housekeeping at these packages; see DOCKER.md.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # A long-lived access token, because Docker Hub's keyless OIDC login
          # requires a Team/Business subscription or DSOS membership.
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No stored secret needed: this token is minted per run and expires
          # with it.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Identical configuration to the merge job's, so the labels and
      # annotations baked into this architecture's manifest carry the same
      # version and revision. Only labels and annotations are consumed here —
      # the digest push carries no tags.
      - name: Compute labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(needs.check.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=WordyMe
            org.opencontainers.image.description=Your own private wiki. Self-hosted notes and documentation, light enough to run on a Raspberry Pi.
            org.opencontainers.image.vendor=TeamCoderz Ltd
            org.opencontainers.image.url=https://teamcoderz.org
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.created=${{ needs.check.outputs.created }}

      - name: Push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Attestations recording what went into the image and how it was
          # built, attached to the manifest. They are verifiable but NOT
          # cryptographically signed — that would need a separate cosign or
          # Sigstore step with an identity token.
          sbom: true
          provenance: mode=max
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",name-canonical=true,push-by-digest=true,push=true
          cache-from: type=gha,scope=linux-amd64

  build-arm64:
    name: Build and push linux/arm64
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR using GITHUB_TOKEN
      security-events: write # upload the Trivy report to the Security tab

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Same gate as amd64: this architecture's image is scanned before its
      # push too, and reports under its own Security tab category.
      - name: Build for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: wordyme:scan
          cache-from: |
            type=gha,scope=linux-arm64
            type=gha
          cache-to: type=gha,mode=max,scope=linux-arm64

      - name: Fail the release on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wordyme:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # A separate category from the amd64 report. Uploading both under one
      # category would make each run look like the other's findings had been
      # fixed, and an arm64-only vulnerability — the kind that blocks a
      # release here and nowhere else — would never appear in the Security
      # tab at all.
      - name: Full vulnerability report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wordyme:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'

      - name: Upload report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: trivy-results.sarif
          category: container-image-arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(needs.check.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=WordyMe
            org.opencontainers.image.description=Your own private wiki. Self-hosted notes and documentation, light enough to run on a Raspberry Pi.
            org.opencontainers.image.vendor=TeamCoderz Ltd
            org.opencontainers.image.url=https://teamcoderz.org
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.created=${{ needs.check.outputs.created }}

      - name: Push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",name-canonical=true,push-by-digest=true,push=true
          cache-from: type=gha,scope=linux-arm64

  # ==========================================================================
  # Merge the digests into the tagged multi-arch manifests
  # ==========================================================================
  # The moment the release becomes pullable by tag: both architectures are
  # already on both registries by digest, and this job ties them into one
  # manifest list per tag. Runs BEFORE the tag job — the tag is the completion
  # marker, so nothing may be tagged until the tagged manifests exist on the
  # registries.
  merge:
    name: Publish the multi-arch tags
    needs: [check, build-amd64, build-arm64]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to GHCR using GITHUB_TOKEN

    steps:
      # Only for DOCKERHUB.md, which the listing-sync step below reads.
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # `latest` is handled by the explicit rule below rather than the
          # default `latest=auto`, which would also emit it from the semver
          # tagger and produce the same tag from two rules.
          flavor: |
            latest=false
          # The version comes from the check job rather than the git ref: this
          # workflow is triggered by a push to main, not by a tag push.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check.outputs.version }}
            type=sha,format=long
            # Never point `latest` at a pre-release. metadata-action also
            # collapses {{major}}.{{minor}} to the full version for
            # pre-releases, so `1.1` can never resolve to a beta either.
            type=raw,value=latest,enable=${{ !contains(needs.check.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=WordyMe
            org.opencontainers.image.description=Your own private wiki. Self-hosted notes and documentation, light enough to run on a Raspberry Pi.
            org.opencontainers.image.vendor=TeamCoderz Ltd
            org.opencontainers.image.url=https://teamcoderz.org
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.created=${{ needs.check.outputs.created }}

      # Values are passed through the environment rather than interpolated
      # straight into the script, so nothing from an expression can be parsed
      # as shell. Each registry's manifest list may only reference digests
      # that live in the same repository, hence one create per registry.
      - name: Create and push the tagged manifests
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            args=()
            while IFS= read -r tag; do
              args+=(-t "$tag")
            done < <(jq -r --arg prefix "$image:" '.tags[] | select(startswith($prefix))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            docker buildx imagetools create "${args[@]}" \
              "$image@$AMD64_DIGEST" \
              "$image@$ARM64_DIGEST"
          done

      - name: Show what was published
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.GHCR_IMAGE }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          echo "Published the following tags:"
          echo "$TAGS"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      # Runs after the push, so the repository exists on Docker Hub by now —
      # the first release creates it. Requires DOCKERHUB_TOKEN to have
      # Read/Write/Delete scope: the description API rejects Read/Write tokens
      # with 403, even though the same token pushes images fine.
      #
      # continue-on-error: by this point the images are already published, and
      # a stale listing is not worth a red release run. The verify-publishing
      # workflow runs this same step *fatally*, so a broken sync is still
      # caught — during rehearsal, not release.
      - name: Sync the Docker Hub listing
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          # A literal rather than the repository description, which is optional
          # on GitHub and would blank the listing if it were ever unset.
          # Docker Hub caps this at 100 characters.
          short-description: 'Self-hosted personal wiki and note-taking app. AGPL-3.0.'
          # A dedicated short page, not DOCKER.md: Docker Hub truncates
          # listings at 25,000 bytes and DOCKER.md is well past that.
          readme-filepath: ./DOCKERHUB.md

  # ==========================================================================
  # Tag the release commit — LAST, as the completion marker
  # ==========================================================================
  # Only reached when the tagged manifests are already on both registries. A
  # tag on this repository therefore always names a published release. Both
  # steps are idempotent, so "Re-run failed jobs" can finish a run that died
  # between the tag push and the release object without tripping over its own
  # progress.
  tag:
    name: Tag and create the GitHub release
    needs: [check, merge]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the version tag and create the GitHub release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow is enough: this job tags HEAD and reads CHANGELOG.md from
          # the workspace; nothing needs history.
          # The tag push below authenticates explicitly; nothing else in this
          # job needs git credentials.
          persist-credentials: false

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push the tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Idempotent: a re-run of a half-finished job finds its own tag and
          # moves on. A tag pointing anywhere else is external interference and
          # stops the job — never retag silently.
          REMOTE_COMMIT=$(git ls-remote origin "refs/tags/v$VERSION^{}" | cut -f1)
          if [ -n "$REMOTE_COMMIT" ]; then
            if [ "$REMOTE_COMMIT" = "$(git rev-parse HEAD)" ]; then
              echo "Tag v$VERSION already points at HEAD — created by a previous attempt of this run."
              exit 0
            fi
            echo "::error::Tag v$VERSION exists but points at $REMOTE_COMMIT, not HEAD. Refusing to retag."
            exit 1
          fi

          # Annotated rather than lightweight: it carries an author and date.
          git tag -a "v$VERSION" -m "v$VERSION"

          # Authenticated for this one command only — see the checkout above.
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"

      - name: Create the GitHub release
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Idempotent, same reasoning as the tag step.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — created by a previous attempt of this run."
            exit 0
          fi

          # The first section of the changelog, i.e. everything from the first
          # "## " heading up to the second.
          awk '/^## /{n++; if (n>1) exit} n>=1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          # A version containing a hyphen is a pre-release (1.3.0-beta.1).
          if [[ "$VERSION" == *-* ]]; then
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
