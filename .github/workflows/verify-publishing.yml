# Rehearses the publishing pipeline without cutting a release.
#
# Run this from the Actions tab before the first real release, and again after
# rotating the Docker Hub token. It exercises every step the release workflow
# does — secrets, both registry logins, the CI build, the vulnerability gate,
# and a real push to both registries — but writes only a disposable `ci-verify`
# tag. No version bump, no git tag, no GitHub release, and `latest` is never
# touched.
#
# The push is the point. `docker login` succeeds with a read-only token and
# only fails later at push time, so a successful login proves nothing about
# write access.

name: Verify publishing setup

on:
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: teamcoderz/wordyme
  GHCR_IMAGE: ghcr.io/teamcoderz/wordyme
  # Deliberately not a version number, so it cannot be mistaken for a release
  # and stands out in the registry listing.
  VERIFY_TAG: ci-verify

jobs:
  verify:
    name: Verify publishing setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Fail in seconds rather than after a five minute build.
      - name: Check the required secrets exist
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=0
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::DOCKERHUB_USERNAME is not set. Add it under Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN is not set. Create a Read/Write/Delete access token on Docker Hub and add it as a repository secret. Delete scope is needed by the listing-sync step: the description API returns 403 for Read/Write tokens, even though pushing works."
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "Both secrets are present."
          fi
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the current version
        id: version
        run: echo "value=$(node -pe "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Shows the tags a release of the current version would publish. Nothing
      # is pushed under these names — this only proves the tagging rules behave.
      - name: Preview the tags a real release would produce
        id: preview
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.value, '-') }}

      - name: Build for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wordyme:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the same vulnerability gate as a release
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wordyme:verify
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # The step that actually proves write access to both registries.
      - name: Push the disposable verify tag
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.VERIFY_TAG }}
            ${{ env.GHCR_IMAGE }}:${{ env.VERIFY_TAG }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `imagetools inspect` exits 0 whatever the manifest contains, so printing
      # it proves nothing. Parse the raw manifest list and fail if either
      # architecture is absent from either registry — a single-arch push would
      # otherwise sail through and only be discovered by a Raspberry Pi user.
      - name: Confirm both architectures landed
        env:
          GHCR: ${{ env.GHCR_IMAGE }}
          HUB: ${{ env.DOCKERHUB_IMAGE }}
          TAG: ${{ env.VERIFY_TAG }}
        run: |
          set -euo pipefail

          assert_arches() {
            ref="$1"
            echo "::group::$ref"
            docker buildx imagetools inspect "$ref"
            echo "::endgroup::"

            raw="$(docker buildx imagetools inspect --raw "$ref")"
            rc=0
            for arch in amd64 arm64; do
              # Selects on os=linux too, so the os/arch "unknown" entries that
              # the SBOM and provenance attestations add cannot satisfy this.
              if printf '%s' "$raw" | jq -e --arg a "$arch" \
                   '.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $a)' >/dev/null; then
                echo "  linux/$arch present in $ref"
              else
                echo "::error::$ref is missing linux/$arch"
                rc=1
              fi
            done
            return "$rc"
          }

          failed=0
          assert_arches "${GHCR}:${TAG}" || failed=1
          assert_arches "${HUB}:${TAG}" || failed=1
          exit "$failed"

      # GHCR creates a package PRIVATE on its first push, even when the
      # repository is public. Anonymous pulls then fail with 401/403 until a
      # human flips the package to public in its settings — and every
      # authenticated step in this job is blind to that, because the workflow
      # pulls as the repository, not as a stranger. So check it the way a
      # self-hoster's machine would: with no credentials at all.
      - name: Confirm the GHCR package is publicly pullable
        env:
          GHCR: ${{ env.GHCR_IMAGE }}
          TAG: ${{ env.VERIFY_TAG }}
        run: |
          set -euo pipefail
          IMG="${GHCR#ghcr.io/}"

          FIX="Fix: repository page -> Packages -> wordyme -> Package settings -> Danger Zone -> Change visibility -> Public. Note: deleting the whole package resets this and the next push recreates it private; delete individual versions only."

          # A private package can surface at either of two stages, both seen
          # against the live registry: GHCR may refuse the anonymous token
          # outright (401 authentication required), or issue one and reject
          # the manifest fetch (403).
          #
          # The network failure case is kept separate from the refusal case on
          # purpose — a timeout that produced an empty token would otherwise be
          # misdiagnosed as "the package is private" and send an operator to
          # the wrong fix.
          if ! RESP="$(curl -s --connect-timeout 5 --max-time 10 \
                "https://ghcr.io/token?scope=repository:${IMG}:pull&service=ghcr.io")"; then
            echo "::error::Could not reach the ghcr.io token endpoint. Network problem or registry outage — not a visibility issue. Retry once GHCR is reachable."
            exit 1
          fi
          TOKEN="$(printf '%s' "$RESP" | jq -r '.token // empty' || true)"
          if [ -z "$TOKEN" ]; then
            echo "::error::GHCR refused to issue an anonymous pull token for ${IMG} — the package is almost certainly private, which is GHCR's default on first push. $FIX"
            exit 1
          fi

          if ! CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            --connect-timeout 5 --max-time 10 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${IMG}/manifests/${TAG}")"; then
            echo "::error::Could not reach ghcr.io for the manifest fetch. Network problem or registry outage — not a visibility issue. Retry once GHCR is reachable."
            exit 1
          fi
          if [ "$CODE" = "200" ]; then
            echo "Anonymous pull works (HTTP 200) — the GHCR package is public."
          elif [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "::error::Anonymous GHCR pull returned HTTP $CODE (access denied). $FIX"
            exit 1
          else
            echo "::error::Anonymous GHCR pull returned HTTP $CODE (unexpected — not a visibility problem). Check that ${IMG}:${TAG} exists and that ghcr.io is healthy."
            exit 1
          fi

      - name: Check the Docker Hub listing sync works
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: 'Self-hosted note-taking and document management for students. AGPL-3.0.'
          # A dedicated short page, not DOCKER.md: Docker Hub truncates
          # listings at 25,000 bytes and DOCKER.md is well past that. This step
          # stays fatal here on purpose — the release workflow marks it
          # continue-on-error, so the rehearsal is where a broken sync must
          # surface.
          readme-filepath: ./DOCKERHUB.md

      - name: Summary
        env:
          PREVIEW_TAGS: ${{ steps.preview.outputs.tags }}
          TAG: ${{ env.VERIFY_TAG }}
        run: |
          {
            echo "## Publishing setup verified"
            echo
            echo "Everything the release workflow needs is working:"
            echo
            echo "- Both secrets are present"
            echo "- Docker Hub and GHCR logins succeed"
            echo "- The image builds on a CI runner"
            echo "- The vulnerability gate passes"
            echo "- **Write access to both registries confirmed by a real push**"
            echo "- Both \`linux/amd64\` and \`linux/arm64\` are in the manifest"
            echo "- The GHCR package is publicly pullable — anonymous pull returns 200"
            echo "- The Docker Hub listing syncs from DOCKERHUB.md"
            echo
            echo "### Tags a release of the current version would publish"
            echo
            echo '```'
            echo "$PREVIEW_TAGS"
            echo '```'
            echo
            echo "### Clean up"
            echo
            echo "A disposable \`${TAG}\` tag now exists in both registries:"
            echo
            echo "- Docker Hub: repository -> Tags -> \`${TAG}\` -> Delete"
            echo "- GHCR: package -> Versions -> the \`${TAG}\` version -> Delete"
            echo
            echo "Leaving it does no harm; it is only untidy."
          } >> "$GITHUB_STEP_SUMMARY"
